<!DOCTYPE html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="index.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4d35e">

  <title>Tłumöcz — Wolne Miösto Mysłowiöce</title>
  <meta name="description" content="Translator into the Mysłowiöce language. | Tłumöcz na jōnzyk mysłowiocki.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://arisnow0.github.io/Tlumocz_Myslowice/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arisnow0.github.io/Tlumocz_Myslowice/">
  <meta property="og:title" content="Tłumöcz — Wolne Miösto Mysłowiöce">
  <meta property="og:description" content="Translator into the Mysłowiöce language. | Tłumöcz na jōnzyk mysłowiocki.">
  <meta property="og:image" content="https://arisnow0.github.io/Tlumocz_Myslowice/flag.jpg">
  <meta property="og:site_name" content="Tłumöcz — Wolne Miösto Mysłowiöce">
  <meta property="og:locale" content="pl_PL">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tłumöcz — Wolne Miösto Mysłowiöce">
  <meta name="twitter:description" content="Translator into the Mysłowiöce language. | Tłumöcz na jōnzyk mysłowiocki.">
  <meta name="twitter:image" content="https://arisnow0.github.io/Tlumocz_Myslowice/flag.jpg">

  <link rel="icon" type="image/png" href="./logo/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./logo/favicon.svg" />
<link rel="shortcut icon" href="./logo/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./logo/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Tłumöcz" />
<link rel="manifest" href="./logo/site.webmanifest" />

</head>
<body>

  <div class="flag-stripe-vertical"></div>

<div class="lang-switcher">
  <img id="langcur" src="flag.jpg" alt="Current Language Flag"/>

  <div class="lang-options hidden" >
    <div class="lang-option" data-lang="mw"><img src="flag.jpg" alt="Mysłowiöcki Flag"/> Mysłowiöcki</div>
    <div class="lang-option" data-lang="pl"><img src="pl.png" alt="Polski Flag"/> Polski</div>
    <div class="lang-option" data-lang="ua"><img src="ua.png" alt="Українська Flag"/> Українська</div>
    <div class="lang-option" data-lang="en"><img src="en.png" alt="English Flag"/> English</div>
    <div class="lang-option" data-lang="ru"><img src="ZOv.jpg" alt="Русский Flag"/> Русский</div>
  </div>
</div>

  <main class="translator-shell">
    <header class="header">
      <div class="eagle-emblem">
        <img id="logo" src="logo.png" alt="Эмблема орла" />
      </div>
      <div>
        <h1 data-i18n="title">Myslowitze Translator</h1>
        <p class="subtitle" data-i18n="subtitle">Official Translator of the Free City of Myslowitze</p>
      </div>
    </header>

    <div class="controls">
  <div class="field">
    <label id="sourceLabel" data-i18n="fromLang">From Language</label>
    <div class="field-content" id="sourceContent">
      <select id="sourceLang"></select>
    </div>
  </div>

  <button id="swapButton" class="swap-icon" title="Swap Languages">↔</button>

  <div class="field">
    <label id="targetLabel" data-i18n="toLang">To Myslowitze</label>
    <div class="field-content" id="targetContent">
      <div id="targetLangBox" class="fixed-target-value">
        <span class="lang-flag"></span> Myslowitze
      </div>
    </div>
  </div>
</div>

    <div class="input-group">
      <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
    </div>

    <div class="actions">
      <button id="translateButton" data-i18n="translateBtn">Translate</button>
      <button id="copyButton" type="button" data-i18n="copyBtn">Copy Result</button>
    </div>

    <div class="result">
      <label data-i18n="resultLabel">Translation Result</label>
      <div id="translatedText" class="output" data-i18n="resultPlaceholder">Translation will appear here.</div>
    </div>

    <footer class="hint">
      <span>SJP.pl Polish Dictionary</span> • Free City of Myslowitze
    </footer>
  </main>

  <script src="index.js"></script>
</body>
</html>
