<body>

  <div class="flag-stripe-vertical"></div>

<div class="lang-switcher">
  <img id="langcur">

  div
</div>

  <main class="translator-shell">
    <header class="header">
      <div class="eagle-emblem">
        <img src="logo.png" alt="Эмблема орла" />
      </div>
      <div>
        <h1>Myslovitze Translator</h1>
        <p class="subtitle">Official Translator of the Free City of Myslovitze</p>
      </div>
    </header>

    <div class="controls">
  <div class="field">
    <label id="sourceLabel">From Language</label>
    <div class="field-content" id="sourceContent">
      <select id="sourceLang"></select>
    </div>
  </div>

  <button id="swapButton" class="swap-icon" title="Swap Languages">↔</button>

  <div class="field">
    <label id="targetLabel">To Myslovitze</label>
    <div class="field-content" id="targetContent">
      <div id="targetLangBox" class="fixed-target-value">
        <span class="lang-flag"></span> Myslovitze
      </div>
    </div>
  </div>
</div>

    <div class="input-group">
      <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
    </div>

    <div class="actions">
      <button id="translateButton">Translate</button>
      <button id="copyButton" type="button">Copy Result</button>
    </div>

    <div class="result">
      <label>Translation Result</label>
      <div id="translatedText" class="output">Translation will appear here.</div>
    </div>

    <footer class="hint">
      <span>SJP.pl Polish Dictionary</span> • Free City of Myslovitze
    </footer>
  </main>

  <script src="index.js"></script>
</body>
</html>
