<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tłumöcz — Wolne Miösto Mysłowiöce</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="flag-stripe-vertical"></div>

  <main class="translator-shell">
    <header class="header">
      <div class="eagle-emblem">
        <img src="logo.png" alt="Эмблема орла" />
      </div>
      <div>
        <h1>Mysłowiöcki Tłumacz</h1>
        <p class="subtitle">Oficjölny tłumöcz Wolne Miösto Mysłowiöce</p>
      </div>
    </header>

    <div class="controls">
  <div class="field">
    <label id="sourceLabel">Z jonzyka</label>
    <div class="field-content" id="sourceContent">
      <select id="sourceLang"></select>
    </div>
  </div>

  <button id="swapButton" class="swap-icon" title="Kiorunok tłumöczonia">↔</button>

  <div class="field">
    <label id="targetLabel">Na Mysłowiöckiego</label>
    <div class="field-content" id="targetContent">
      <div id="targetLangBox" class="fixed-target-value">
        <span class="lang-flag"></span> Mysłowiöcki
      </div>
    </div>
  </div>
</div>

    <div class="input-group">
      <textarea id="sourceText" placeholder="Введите текст для перевода..."></textarea>
    </div>

    <div class="actions">
      <button id="translateButton">Tłumöczyć</button>
      <button id="copyButton" type="button">Skopiuj wynik</button>
    </div>

    <div class="result">
      <label>Wynik tłumöczonia</label>
      <div id="translatedText" class="output">Tłumöczonie pojöwi się tutöj.</div>
    </div>

    <footer class="hint">
      <span>SJP.pl</span> • Wolne Miösto Mysłowiöce Portöl stönowy
    </footer>
  </main>

  <script src="index.js"></script>
</body>
</html>
